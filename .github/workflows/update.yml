name: update-calendars

on:
  schedule:
    # Thursdays 07:30 UTC, before Lidl's offers switch over.
    # Not :00 - GitHub delays heavily-loaded scheduled jobs.
    - cron: "30 7 * * 4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape Lidl and write .ics
        run: python3 lidl_ics.py --outdir .

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add food.ics nonfood.ics all.ics flavour.ics
          if git diff --staged --quiet; then
            echo "No change - offers identical to last week."
            exit 0
          fi
          git commit -m "update: $(git show :all.ics | grep -c BEGIN:VEVENT) offers"
          git push
